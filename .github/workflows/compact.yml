name: compact

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Partition date (YYYY-MM-DD). Leave blank to compact all."
        required: false
        default: ""
      dry_run:
        description: "Dry run (list only, no writes)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  compact:
    name: Compact Parquet partitions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MTG_S3_BUCKET: ${{ vars.MTG_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run compactor
        run: |
          args=""
          [ -n "${{ inputs.date }}" ] && args="--dt ${{ inputs.date }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          python -m scripts.compact $args
