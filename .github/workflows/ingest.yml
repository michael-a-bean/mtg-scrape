name: daily-ingest

on:
  schedule:
    # MTGJSON rebuilds ~03:00 UTC. Give it 30 min of slack.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write      # required for AWS OIDC
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  mtgjson-prices:
    name: MTGJSON AllPricesToday → S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTG_S3_BUCKET: ${{ vars.MTG_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: python -m src.ingest

  mtgjson-printings:
    name: MTGJSON AllPrintings (Parquet) → S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTG_S3_BUCKET: ${{ vars.MTG_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m scripts.allprintings_parquet

  scryfall:
    name: Scryfall default_cards → S3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MTG_S3_BUCKET: ${{ vars.MTG_S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m scripts.scryfall_bulk
