[project]
name = "mtg-scrape"
version = "0.1.0"
description = "Daily MTG price archive from MTGJSON + Scryfall to S3 Parquet lake"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pyarrow>=16.0",
    "ijson>=3.2",
    "requests>=2.32",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
